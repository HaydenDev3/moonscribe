<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">MoonScribe writing studio</title>
  <desc id="desc">Illustration of a calm writing studio with a manuscript, cover mockup, and moonlit feelings.</desc>
  <defs>
    <linearGradient id="gradBg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="55%" stop-color="#171d34"/>
      <stop offset="100%" stop-color="#221d2f"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#9ec5ff"/>
      <stop offset="40%" stop-color="#8eb6d6"/>
      <stop offset="100%" stop-color="#7067dd"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#efe5ff"/>
      <stop offset="100%" stop-color="#d5eaff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#0a0d18" flood-opacity="0.45"/>
    </filter>
    <style><![CDATA[
      .float { animation: float 9s ease-in-out infinite; }
      .drift { animation: drift 12s ease-in-out infinite alternate; }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes drift {
        0% { transform: translateX(-8px); }
        100% { transform: translateX(8px); }
      }
    ]]></style>
  </defs>

  <rect width="1400" height="720" fill="url(#gradBg)"/>
  <circle cx="1110" cy="150" r="88" fill="#f5f1d8" opacity="0.9"/>
  <circle cx="1090" cy="130" r="68" fill="#d7d8ff" opacity="0.18"/>

  <g class="drift">
    <rect x="160" y="150" width="420" height="420" rx="24" fill="#f6f3fd" opacity="0.09" stroke="#dfe6ff" stroke-opacity="0.26"/>
    <rect x="195" y="200" width="350" height="280" rx="18" fill="#f2eef9" opacity="0.92"/>
    <path d="M228 240 h278" stroke="#c7c9db" stroke-width="5" stroke-linecap="round"/>
    <path d="M228 282 h244" stroke="#d8dae5" stroke-width="5" stroke-linecap="round"/>
    <path d="M228 324 h260" stroke="#d8dae5" stroke-width="5" stroke-linecap="round"/>
    <path d="M228 366 h230" stroke="#d8dae5" stroke-width="5" stroke-linecap="round"/>
    <circle cx="230" cy="420" r="17" fill="#a5d3ff"/>
    <circle cx="260" cy="420" r="17" fill="#c9c6ff"/>
    <circle cx="290" cy="420" r="17" fill="#a8f0d8"/>
    <path d="M230 466 h190" stroke="#cfcdf5" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g class="float" filter="url(#shadow)">
    <g transform="translate(720 170) rotate(-8 200 200)">
      <rect x="0" y="0" width="420" height="430" rx="26" fill="url(#coverGrad)"/>
      <rect x="35" y="35" width="350" height="360" rx="18" fill="#0e1323" opacity="0.2"/>
      <text x="210" y="160" fill="url(#textGrad)" font-family="Georgia, serif" font-size="58" font-weight="700" text-anchor="middle">Moon</text>
      <text x="210" y="225" fill="url(#textGrad)" font-family="Georgia, serif" font-size="56" font-weight="700" text-anchor="middle">Whisper</text>
      <text x="210" y="285" fill="#f8f0ff" font-size="20" font-family="Arial, sans-serif" letter-spacing="3" text-anchor="middle">FOR STORM TATTERSALL</text>
      <circle cx="210" cy="330" r="18" fill="#f7dca3" opacity="0.9"/>
      <path d="M175 325 C 193 310, 227 310, 245 325" stroke="#fbe8c5" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <g opacity="0.9">
    <circle cx="830" cy="520" r="6" fill="#fff3c9"/>
    <circle cx="910" cy="548" r="4" fill="#dfe9ff"/>
    <circle cx="1000" cy="518" r="5" fill="#c7f0ff"/>
    <circle cx="1078" cy="560" r="4.5" fill="#f7d3ff"/>
  </g>
</svg>
